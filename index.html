        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'gallery-card text-left rounded-2xl p-4 sm:p-5 flex flex-col cursor-pointer focus:outline-none';
        card.innerHTML = `
          <div class="flex items-center justify-between text-[11px] tracking-[0.18em] text-espresso/70 mb-3">
            <span>${CATEGORY_LABELS[item.cat]}</span>
            <span class="font-medium">NO. ${String(idx + 1).padStart(2, '0')}</span>
          </div>
          <div class="w-full aspect-square rounded-xl bg-mistDeep border border-espresso/20 p-2 mb-4 flex items-center justify-center">
            ${buildSketchSVG(idx, 'grid')}
          </div>
          <h2 class="font-serif text-base sm:text-lg font-bold text-espresso leading-snug mb-2">
            ${item.name}
          </h2>
          <p class="text-xs sm:text-[13px] text-espresso/85 leading-relaxed line-clamp-3 mt-auto">
            ${item.desc}
          </p>
        `;
        card.addEventListener('click', () => openModal(idx));
        gridEl.appendChild(card);
      });
    }

    document.querySelectorAll('.filter-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid(btn.dataset.cat);
      });
    });

    /* =========================================================================
       4. MODAL LOGIC (LARGE VIEW + INGREDIENTS + PARTNER/NEMESIS + PREV/NEXT)
       ========================================================================= */
    const modalEl = document.getElementById('detail-modal');

    function updateModalContent(idx) {
      currentModalIdx = (idx + RESULTS.length) % RESULTS.length;
      const item = RESULTS[currentModalIdx];
      const partnerIdx = (currentModalIdx + 11) % RESULTS.length;
      const nemesisIdx = (currentModalIdx + 23) % RESULTS.length;

      document.getElementById('modal-category').textContent = CATEGORY_LABELS[item.cat];
      document.getElementById('modal-code').textContent = `NO. ${String(currentModalIdx + 1).padStart(2, '0')}`;
      document.getElementById('modal-name').textContent = item.name;
      document.getElementById('modal-desc').textContent = item.desc;
      document.getElementById('modal-svg-wrap').innerHTML = buildSketchSVG(currentModalIdx, 'modal');

      const ingEl = document.getElementById('modal-ingredients');
      ingEl.innerHTML = '';
      item.ingredients.forEach(([label, pct]) => {
        const row = document.createElement('div');
        row.innerHTML = `
          <div class="flex justify-between text-xs text-pureWhite mb-1">
            <span>${label}</span>
            <span class="font-medium text-porcelain">${pct}%</span>
          </div>
          <div class="w-full h-2 rounded-full bg-espressoDark overflow-hidden">
            <div class="h-full rounded-full bg-porcelain" style="width: ${pct}%;"></div>
          </div>
        `;
        ingEl.appendChild(row);
      });

      document.getElementById('modal-partner').textContent = RESULTS[partnerIdx].name;
      document.getElementById('modal-nemesis').textContent = RESULTS[nemesisIdx].name;
    }

    function openModal(idx) {
      updateModalContent(idx);
      modalEl.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modalEl.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    modalEl.addEventListener('click', (e) => {
      if (e.target === modalEl) closeModal();
    });
    document.getElementById('btn-prev').addEventListener('click', () => updateModalContent(currentModalIdx - 1));
    document.getElementById('btn-next').addEventListener('click', () => updateModalContent(currentModalIdx + 1));

    document.addEventListener('keydown', (e) => {
      if (!modalEl.classList.contains('open')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') updateModalContent(currentModalIdx - 1);
      if (e.key === 'ArrowRight') updateModalContent(currentModalIdx + 1);
    });

    // Initial render
    renderGrid('all');
  </script>
</body>
</html>
